<div class="container">
  <div class="row">
    <div class="col-10">
      <h1>
        Welcome to {{ title }}!
      </h1>
    </div>
    <div class="col-2 text-right" *ngIf="user">
      <div class="user-info">
        <span class="user-name">{{ user.name }}</span>
        <button class="btn btn-sm btn-outline-secondary" (click)="signOut()">Sign Out</button>
      </div>
    </div>
  </div>

  <!-- Router outlet for the different views -->
  <router-outlet></router-outlet>
</div>
